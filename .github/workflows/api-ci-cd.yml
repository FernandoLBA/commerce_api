# Nombre del flujo de trabajo en GitHub Actions
name: CI/CD Nestjs to ECR then EC2

# Eventos que disparan la ejecución
on:
  workflow_dispatch: # Permite ejecución manual desde la consola de GitHub
  push:
    branches:
      - main # Ejecución automática al hacer push en la rama 'main'
      - release
      - develop

jobs:
  # ==========================================
  # JOB 1: Integración Continua (Chequeos con pnpm)
  # ==========================================
  ci:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clona el código fuente del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Instala el gestor de paquetes pnpm en el runner de GitHub
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Se alinea con la versión usada en desarrollo local

      # Paso 3: Configura el entorno de ejecución Node.js con caché para pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: "pnpm"
          cache-dependency-path: "./api/pnpm-lock.yaml"

      # Paso 4: Instala dependencias estrictamente desde pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./api

      # Paso 5: Genera los tipos e interfaces del cliente de Prisma
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        working-directory: ./api

      # Paso 6: Ejecuta la validación de código estático (Linter)
      - name: Lint
        run: pnpm run lint:ci
        working-directory: ./api

      # Paso 7: Lanza las pruebas automatizadas
      - name: Run tests
        run: pnpm test
        working-directory: ./api

  # ==========================================
  # JOB 2: Despliegue Continuo (AWS ECR + EC2)
  # ==========================================
  deploy:
    needs: ci # Garantiza ejecución solo si el job 'ci' pasa con éxito
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Requerido para la autenticación OIDC con AWS
      contents: read # Acceso de lectura al repositorio

    steps:
      # Paso 1: Clona el código fuente
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Autenticación en AWS mediante OIDC (sin credenciales estáticas)
      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Paso 3: Inicia sesión en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Paso 4: Configura el motor Buildx para compilaciones multiplataforma
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 5: Compila y sube la imagen especificando la arquitectura del servidor (linux/amd64)
      - name: Build and Push Docker Image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64 # Evita la advertencia y fallos de emulación en la EC2
          push: true
          tags: ${{ secrets.ECR_REPOSITORY }}:latest

      # Paso 6: Despliegue remoto en la EC2 mediante SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Autenticación en ECR desde el servidor
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

            # 2. Descarga de la última imagen compilada para linux/amd64
            docker pull ${{ secrets.ECR_REPOSITORY }}:latest

            # 3. Limpieza del contenedor previo
            docker stop ecommerce-nest-api || true
            docker rm ecommerce-nest-api || true

            # 4. Extracción de variables desde AWS Secrets Manager y conversión a formato .env
            aws secretsmanager get-secret-value \
              --secret-id ecommerce-nest-prod-secrets \
              --query SecretString \
              --output text | jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' > /tmp/.env.prod

            # 5. Obtención dinámica del puerto
            APP_PORT=$(grep ^PORT= /tmp/.env.prod | cut -d '=' -f2)
            APP_PORT=${APP_PORT:-3000}

            # 6. Lanzamiento del nuevo contenedor usando --env-file
            docker run -d \
              -p $APP_PORT:$APP_PORT \
              --name ecommerce-nest-api \
              --env-file /tmp/.env.prod \
              ${{ secrets.ECR_REPOSITORY }}:latest

            # 7. Remoción del archivo .env temporal para mitigar riesgos de seguridad
            rm -f /tmp/.env.prod

            # 8. Limpieza de imágenes huérfanas en el disco
            docker image prune -f
